<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Искра рисует</title><link rel="icon" href="logo.svg"><style>*{box-sizing:border-box}body{margin:0;background:#f7f1e7;color:#292820;font:16px system-ui}main{max-width:1000px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:12px}header img{width:40px;height:50px}a{color:inherit}h1{font-size:clamp(32px,7vw,58px);margin-bottom:12px}p{line-height:1.6;color:#776f65}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button,select{font:inherit;padding:12px 18px;border-radius:12px;border:1px solid #d9cfc0;background:#fffaf3;color:#292820;cursor:pointer}button:first-of-type{background:#ef6742;color:white;border:0}canvas{display:block;width:100%;height:auto;border-radius:20px;background:#fffaf3;border:1px solid #d9cfc0}button:focus-visible,select:focus-visible{outline:3px solid #7868b2}#status{min-height:30px}</style><main><header><img src="logo.svg" alt="Маскот"><a href="./">искра / в мастерскую</a></header><h1>Дай искре порисовать.</h1><p>Случайные персонажи и маленькие миры. Каждый рисунок собирается заново из форм, цветов и деталей — без нейросети.</p><div class="tools"><select id="mode" aria-label="Сюжет"><option value="random">Случайный сюжет</option><option value="creature">Чудик</option><option value="garden">Цветочный сад</option><option value="landscape">Другой мир</option></select><button id="new">Ещё рисунок</button><button id="download">Сохранить PNG</button></div><canvas id="art" width="1200" height="800" aria-label="Случайно созданный рисунок"></canvas><p id="status" role="status" aria-live="polite"></p><p>Без внешних ресурсов. Рисунки не отправляются на сервер. Скачай понравившийся — следующая генерация заменит его.</p></main><script>'use strict';const canvas=document.getElementById('art'),c=canvas.getContext('2d'),mode=document.getElementById('mode'),status=document.getElementById('status');const r=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];let palette=[],title='',count=0;const sets=[['#ef6742','#f6bc60','#7868b2','#527a71','#f9e8c9'],['#e8849d','#79b4c2','#f3d36c','#6570a8','#f9e1e7'],['#cf7856','#9ba97c','#5b7a78','#c1a8ce','#f2e8d7']];function ellipse(x,y,rx,ry,color,stroke=true){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fillStyle=color;c.fill();if(stroke)c.stroke()}function line(points){c.beginPath();c.moveTo(...points[0]);for(let i=1;i<points.length;i++)c.lineTo(...points[i]);c.stroke()}function polygon(points,color){c.beginPath();c.moveTo(...points[0]);points.slice(1).forEach(p=>c.lineTo(...p));c.closePath();c.fillStyle=color;c.fill();c.stroke()}function flower(x,y,s){c.save();c.translate(x,y);c.scale(s,s);c.lineWidth=3;c.strokeStyle='#292820';line([[0,0],[r(-12,12),95]]);ellipse(-16,55,20,9,palette[3]);const petals=Math.floor(r(5,10)),col=pick(palette.slice(0,4));for(let j=0;j<petals;j++){c.save();c.rotate(j*Math.PI*2/petals);ellipse(0,-25,12,25,col);c.restore()}ellipse(0,0,14,14,palette[1]);c.restore()}function creature(){const x=r(420,780),y=r(340,460),w=r(120,210),h=r(150,225),body=pick(palette.slice(0,4));for(let i=0;i<9;i++)flower(r(50,1150),r(650,720),r(.3,.6));c.save();c.translate(x,y);c.lineWidth=7;line([[-w*.5,h*.65],[-w*.65,h+55],[-w*.9,h+55]]);line([[w*.5,h*.65],[w*.65,h+55],[w*.95,h+55]]);line([[-w*.8,0],[-w-60,70],[-w-85,20]]);line([[w*.8,0],[w+65,-20],[w+85,-75]]);if(Math.random()<.5){polygon([[-w*.7,-h*.6],[-w*.65,-h-70],[-w*.2,-h*.8]],body);polygon([[w*.2,-h*.8],[w*.65,-h-70],[w*.7,-h*.6]],body)}else{line([[-w*.4,-h*.8],[-w*.6,-h-65]]);line([[w*.4,-h*.8],[w*.6,-h-65]]);ellipse(-w*.6,-h-65,16,16,palette[1]);ellipse(w*.6,-h-65,16,16,palette[1])}ellipse(0,0,w,h,body);const eyes=pick([1,2,3]);for(let i=0;i<eyes;i++){const ex=(i-(eyes-1)/2)*w*.6;ellipse(ex,-h*.22,w*.19,h*.23,'#fffaf3');ellipse(ex+r(-5,5),-h*.2,w*.075,h*.095,'#292820',false)}c.beginPath();c.arc(0,h*.23,w*.27,0,Math.PI);c.stroke();ellipse(-w*.55,h*.17,20,10,'#ef9f91',false);ellipse(w*.55,h*.17,20,10,'#ef9f91',false);for(let i=0;i<3;i++)ellipse(r(-w*.35,w*.35),r(h*.5,h*.75),r(4,9),r(4,9),palette[1]);c.restore();title=pick(['Хранитель','Мечтатель','Собиратель'])+' '+pick(['облаков','крошечных историй','утреннего света','забытых идей'])}function garden(){c.fillStyle=palette[3];c.fillRect(0,690,1200,110);for(let i=0;i<Math.floor(r(18,30));i++)flower(r(40,1160),r(260,660),r(.6,1.4));for(let i=0;i<8;i++){const x=r(50,1150),y=r(90,300);ellipse(x-10,y,12,8,palette[0]);ellipse(x+10,y,12,8,palette[2]);line([[x,y-6],[x,y+8]])}title='Сад '+pick(['на другой планете','после дождя','несбывшихся снов','маленьких открытий'])}function landscape(){ellipse(r(150,1000),r(100,240),r(45,95),r(45,95),palette[1]);for(let layer=0;layer<3;layer++){const pts=[[0,800],[0,420+layer*100]];for(let x=0;x<=1200;x+=120)pts.push([x,r(290+layer*120,510+layer*70)]);pts.push([1200,800]);polygon(pts,palette[layer+1])}for(let i=0;i<Math.floor(r(4,9));i++){const x=r(60,1140),y=r(560,720),h=r(45,130),w=r(30,70);c.fillStyle=palette[4];c.fillRect(x-w/2,y-h,w,h);c.strokeRect(x-w/2,y-h,w,h);polygon([[x-w*.7,y-h],[x,y-h-r(25,65)],[x+w*.7,y-h]],palette[0]);ellipse(x,y-h*.6,7,9,palette[1])}for(let i=0;i<10;i++)flower(r(20,1180),r(720,765),r(.2,.4));title=pick(['Долина','Городок','Планета'])+' '+pick(['двух рассветов','тихих чудес','цветных ветров','домов-мечтателей'])}function draw(){palette=pick(sets);c.clearRect(0,0,1200,800);c.fillStyle=palette[4];c.fillRect(0,0,1200,800);c.lineCap='round';c.lineJoin='round';c.lineWidth=4;c.strokeStyle='#292820';for(let i=0;i<130;i++)ellipse(r(0,1200),r(0,800),r(.5,1.8),r(.5,1.8),'#29282012',false);const type=mode.value==='random'?pick(['creature','garden','landscape']):mode.value;({creature,garden,landscape})[type]();count++;status.textContent='Рисунок '+count+' — «'+title+'»'}document.getElementById('new').onclick=draw;mode.onchange=draw;document.getElementById('download').onclick=()=>canvas.toBlob(blob=>{if(!blob){status.textContent='Не удалось сохранить рисунок';return}const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='iskra-'+count+'.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)},'image/png');draw();</script></html>
